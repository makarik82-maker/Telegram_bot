name: Daily News Bot

on:
  schedule:
    # Запуск каждый день в 08:00 по UTC (это 11:00 по Мск). 
    # Если нужно другое время, меняй цифры. Формат: минута час день месяц день_недели
    - cron: '0 8 * * *'
  workflow_dispatch: # Эта строчка позволяет запускать бота вручную кнопкой для тестов

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the bot
      env:
        # Передаем наши секретные ключи в код
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      run: python main.py
