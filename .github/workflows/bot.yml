name: Hourly News Bot

on:
  schedule:
    # Запуск каждый час с 03:00 до 19:00 по UTC (это 06:00 - 22:00 по Москве)
    # Формат: минута час день_месяца месяц день_недели
    - cron: '0 */1 * * *'
  
  # Позволяет запускать вручную для тестирования
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run the bot
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
      run: python main.py

    - name: Commit and push published_news.json
      # Сохраняем файл даже если бот упал на этапе отправки в Telegram, 
      # чтобы не потерять прогресс, но коммитим только если файл изменился
      if: always()
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add published_news.json
        git diff --staged --quiet || git commit -m "chore: update published news list [skip ci]"
        # Pull latest changes before push to avoid conflicts
        git pull --rebase origin main
        git push
